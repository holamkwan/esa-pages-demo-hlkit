name: Sync ChatGPT Sites mirror

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hlkit-site-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download published website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _download mirror.new
          mkdir -p mirror.new
          set +e
          wget \
            --mirror \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --timeout=30 \
            --tries=3 \
            --waitretry=3 \
            --user-agent="Mozilla/5.0 (compatible; HLKiT-Mirror/1.0)" \
            -e robots=off \
            --directory-prefix=_download \
            https://www.hlkit.com/
          wget_status="$?"
          set -e
          if [ "$wget_status" -ne 0 ] && [ "$wget_status" -ne 8 ]; then
            exit "$wget_status"
          fi
          test -s _download/www.hlkit.com/index.html
          cp -a _download/www.hlkit.com/. mirror.new/
          touch mirror.new/.nojekyll

      - name: Restore compressed assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' compressed; do
            target="${compressed%.gz}"
            gzip -cd -- "$compressed" > "$target.new"
            test -s "$target.new"
            mv -f -- "$target.new" "$target"
          done < <(find mirror.new -type f -name '*.gz' -print0)

      - name: Add clean URL compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("mirror.new")
          routes = ("products", "solutions", "support", "about", "contact", "privacy")
          for route in routes:
              source = root / f"{route}.html"
              if not source.is_file() or source.stat().st_size == 0:
                  raise SystemExit(f"Missing route source: {source}")
              text = source.read_text(encoding="utf-8", errors="ignore")
              text = re.sub(r'(src|href)="((?:assets|images)/[^"]+|hlkit-(?:mark\.png|logo\.jpg))"', r'\1="/\2"', text)
              text = text.replace('import("assets/', 'import("/assets/')
              for link in routes:
                  text = text.replace(f'href="{link}.html"', f'href="/{link}"')
              target = root / route / "index.html"
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8")
          PY

      - name: Validate mirror
        shell: bash
        run: |
          set -euo pipefail
          test -s mirror.new/index.html
          test -n "$(find mirror.new/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          test -n "$(find mirror.new/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          for route in products solutions support about contact privacy; do
            test -s "mirror.new/$route/index.html"
            ! grep -q 'src="hlkit-mark.png"' "mirror.new/$route/index.html"
          done
          if grep -RqiE "Attention Required|Just a moment|Checking your browser|cf-chl-|captcha" mirror.new/*.html; then
            exit 1
          fi

      - name: Publish only when content changed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mirror.old
          if [ -d mirror ]; then mv mirror mirror.old; fi
          mv mirror.new mirror
          rm -rf mirror.old _download
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mirror
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update ChatGPT Sites mirror"
          git push
